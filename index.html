const OUTCOME_METRICS = {
  repeat_rate:{label:'Repeat purchase rate',unit:'pct',better:'up'},
  return_rate:{label:'Return + RTO rate',unit:'pct',better:'down'},
  aov:{label:'Average order value',unit:'inr',better:'up'},
  conversion_rate:{label:'Store conversion rate',unit:'pct',better:'up'}
};
function storeMetric(wsId, metric){
  const os = rows('Order',o=>o.workspace_id===wsId); if(!os.length) return null;
  if(metric==='aov') return Math.round(os.reduce((a,o)=>a+o.value_inr,0)/os.length);
  if(metric==='return_rate') return Math.round(os.filter(o=>o.status!=='delivered').length/os.length*1000)/10;
  if(metric==='repeat_rate'){ const by={}; os.forEach(o=>by[o.person_id]=(by[o.person_id]||0)+1); const n=Object.keys(by).length; return Math.round(Object.values(by).filter(x=>x>=2).length/n*1000)/10; }
  return null;
}
function fmtOutcome(metric,v){ return v==null?'—':OUTCOME_METRICS[metric].unit==='inr'?inr(v):pct(v); }
function outcomeVerdict(o){
  if(o.current_value==null) return null;
  const rel = (o.current_value-o.baseline_value)/Math.max(0.0001,Math.abs(o.baseline_value));
  const good = OUTCOME_METRICS[o.metric].better==='up'? rel : -rel;
  return good>=0.05?{k:'ok',t:'Worked'}:good<=-0.05?{k:'bad',t:'Got worse'}:{k:'',t:'No clear change'};
}

// ---------- said vs did ----------
function saidVsDid(s){
  const done = completedOf(s.id);
  const buyers = done.filter(x=>buyerStats(x.person_id));
  if(buyers.length<3 || buyers.length<done.length*0.5) return null;
  const stats = list=>{ const bs=list.map(x=>buyerStats(x.person_id)).filter(Boolean); if(!bs.length) return null;
    const ord=bs.reduce((a,b)=>a+b.n,0);
    return {n:bs.length,repeat:bs.filter(b=>b.n>=2).length/bs.length*100,aov:bs.reduce((a,b)=>a+b.aov,0)/bs.length,ret:bs.reduce((a,b)=>a+b.returns,0)/ord*100}; };
  return rows('Theme',t=>t.study_id===s.id).sort((a,b)=>a.position-b.position).map(t=>{
    const sup = new Set(t.supporting_session_ids||[]);
    return {t, yes:stats(buyers.filter(x=>sup.has(x.id))), no:stats(buyers.filter(x=>!sup.has(x.id)))};
  }).filter(r=>r.yes&&r.no);
}
function saidVsDidCard(s){
  const rowsSD = saidVsDid(s);
  const done = completedOf(s.id);
  if(!rowsSD){
    if(!done.length) return '';
    return `<section class="card tint banner"><div class="avatar" style="width:44px;height:44px;background:var(--surface)">${ic('link')}</div><div><b>No purchase data on these respondents</b><p class="small muted">This study used the Voqiva panel, which suits new-concept and category research. Run it with your own customers to see what people said next to what they actually bought.</p></div></section>`;
  }
  const best = rowsSD.map(r=>({r,gap:Math.abs(r.yes.ret-r.no.ret)})).sort((a,b)=>b.gap-a.gap)[0];
  const cell=(a,b,fmt,lowerBetter)=>{ const d=a-b; const bad = lowerBetter? d>2 : d<-2; const good = lowerBetter? d<-2 : d>2; return `<td class="num" style="text-align:right;${bad?'color:var(--bad);font-weight:600':good?'color:var(--ok);font-weight:600':''}">${fmt(a)}</td><td class="num muted" style="text-align:right">${fmt(b)}</td>`; };
  return `<section class="card stack">
    <div class="row between"><div><h3>What they said vs what they did</h3><p class="small muted">Each theme's supporters compared with the other respondents, using their real order history.</p></div><span class="pill buy">${ic('check')}${done.filter(x=>buyerStats(x.person_id)).length}/${done.length} purchase-verified</span></div>
    ${best && best.gap>=3?`<div class="well small"><b>Biggest gap:</b> people in “${esc(best.r.t.name)}” return or refuse ${pct(best.r.yes.ret)} of orders vs ${pct(best.r.no.ret)} for everyone else.</div>`:''}
    <div class="table-wrap"><table><thead><tr><th>Theme</th><th style="text-align:right">People</th><th style="text-align:right">Return / RTO</th><th style="text-align:right">Others</th><th style="text-align:right">Avg order</th><th style="text-align:right">Others</th><th style="text-align:right">Repeat</th><th style="text-align:right">Others</th></tr></thead><tbody>
    ${rowsSD.map(r=>`<tr><td><b>${esc(r.t.name)}</b><div class="small muted">${CAT_LABEL[r.t.category]}</div></td><td class="num" style="text-align:right">${r.yes.n}</td>${cell(r.yes.ret,r.no.ret,pct,true)}${cell(r.yes.aov,r.no.aov,inr,false)}${cell(r.yes.repeat,r.no.repeat,pct,false)}</tr>`).join('')}
    </tbody></table></div></section>`;
}

  const askedSkin = new Set(rows('Session',s=>s.study_id===x.sB.id).map(s=>s.person_id));
  skin.forEach(p=>{
    const r = RNG(); const st = scared.has(p.id) ? (r<0.45?'returned':'delivered') : (r<0.08?'returned':r<0.12?'rto':'delivered');
    mkOrder(p, 50+Math.floor(RNG()*60), 699+Math.round(RNG()*9)*100, st);
    if(askedSkin.has(p.id) || RNG()<0.7) consent(p,'checkout_optin',50+Math.floor(RNG()*10));
  });
  // khadi high-LTV: 3-7 orders over a year
  const khadi = rows('Person',p=>p.cohort_import_id===x.ciD.id);
  khadi.forEach(p=>{
    const n = 3+Math.floor(RNG()*5); let d = 380;
    for(let i=0;i<n;i++){ d = Math.max(5, d-Math.floor(30+RNG()*90)); mkOrder(p,d,1100+Math.round(RNG()*17)*100, RNG()<0.06?'returned':'delivered'); }
    if(RNG()<0.75) consent(p,'checkout_optin',200+Math.floor(RNG()*100));
  });
  // new customers (last 30 days)
  const ciN = ins('CohortImport',{workspace_id:ws.id,name:'Shopify · New customers, last 30 days',source:'shopify',created_at:iso(now-1*D)});
  for(let i=0;i<34;i++){
    const g = RNG()<0.5?'male':'female';
    const p = ins('Person',{cohort_import_id:ciN.id,full_name:pick(PANEL_NAMES[g])+' '+String.fromCharCode(65+Math.floor(RNG()*26)),phone:'+91 9'+String(Math.floor(RNG()*1e9)).padStart(9,'0'),gender:g,
      birth_date:(1988+Math.floor(RNG()*14))+'-0'+(1+Math.floor(RNG()*9))+'-1'+Math.floor(RNG()*9),city:pick(CITIES)[0],occupation:null,attributes:{},upi_vpa:null,aadhaar_verified_at:null,linkedin_verified_at:null,upi_verified_at:null});
    mkOrder(p, 2+Math.floor(RNG()*24), 999+Math.round(RNG()*12)*100, RNG()<0.1?'rto':'delivered');
    if(RNG()<0.62) consent(p,'checkout_optin',2+Math.floor(RNG()*20));
  }
  // one customer who opted out (shows the one-tap withdrawal)
  const optOut = rows('Consent',c=>c.workspace_id===ws.id)[3]; if(optOut) optOut.withdrawn_at = iso(now-3*D);

  // always-on returns study (khadi customers whose latest order came back)
  const tr = createTrigger(ws.id, u.id, 'return_or_rto', 10);
  const sR = byId('Study', tr.study_id);
  const rPeople = khadi.filter(p=>consentOf(p.id)&&!consentOf(p.id).withdrawn_at).slice(0,8);
  rPeople.forEach(p=>{ const last = ordersOf(p.id).pop(); last.status = RNG()<0.75?'returned':'rto'; });
  const launched = now-6*D;
  upd('Study',sR.id,{launched_at:iso(launched),sample_size:rPeople.length,created_at:iso(launched-D)});
  fieldSeed(sR,'returns',questionsOf(sR.id),rPeople,{t0:launched});
  ins('WalletTransaction',{workspace_id:ws.id,study_id:sR.id,kind:'incentive_reserve',amount_inr:-rPeople.length*sR.incentive_inr,created_at:iso(launched)});
  tr.last_run_at = iso(launched);
  synthFromScript(sR,'returns',launched+5*3600000);
  // a few more returners waiting for next week's batch
  khadi.filter(p=>!rPeople.includes(p)&&consentOf(p.id)&&!consentOf(p.id).withdrawn_at).slice(0,6).forEach(p=>{ const last=ordersOf(p.id).pop(); last.status='returned'; });

  // outcomes
  const snackPricing = one('Recommendation',r=>r.study_id===x.sA.id&&r.workstream==='pricing');
  if(snackPricing){ snackPricing.status='done'; ins('Outcome',{recommendation_id:snackPricing.id,metric:'conversion_rate',change_ref:'Hero SKU repriced to ₹199 for 90 g on Blinkit and Zepto (3 Nov)',baseline_value:2.1,baseline_at:iso(now-33*D),current_value:2.9,measured_at:iso(now-2*D),source:'simulated'}); }
  const skinCard = one('Recommendation',r=>r.study_id===x.sB.id&&r.workstream==='product');
  seedPanel();
  if(skinCard){ skinCard.status='in_progress'; ins('Outcome',{recommendation_id:skinCard.id,metric:'repeat_rate',change_ref:'3-step routine card added to every first order',baseline_value:storeMetric(ws.id,'repeat_rate'),baseline_at:iso(now-5*D),current_value:null,measured_at:null,source:'simulated'}); }
}

  return `<div class="vn ${dark?'dark':''}">${ic('play')}<span class="bars">${h}</span><span class="small num">${mmss(secs*1000)}</span></div>`;
}

function makePanelist(key, o){
  o = o||{}; const R = o.rng||RNG; const g = SEG_GEN[key](R); const now=Date.now(), D=86400000;
  const gender = o.gender || g.gender || (R()<0.52?'male':'female');
  const age = o.age!=null? o.age : g.age;
  const by = new Date(now).getFullYear()-age-1, bm=1+Math.floor(R()*12);
  const first = pick(PANEL_NAMES[gender==='other'?'female':gender],R);
  const src = o.source || pick(g.src,R);
  const attrs = Object.assign({industry:o.industry||g.industry,d2c_fashion_orders_60d:Math.floor(R()*5),quick_commerce_orders_30d:Math.floor(R()*12),skincare_buyer:R()<0.45,workouts_per_week:Math.floor(R()*3),
    source:src,joined_at:iso(o.joinedNow? now : now-(R()<0.18?R()*30:30+R()*330)*D),quality_score:60+Math.floor(R()*39),studies_30d:Math.floor(R()*3)}, g.attrs||{}, o.attrs||{});
  if(R()<0.05) attrs.quality_score = 40+Math.floor(R()*18);
  if(R()<0.05) attrs.studies_30d = 4;
  const T0 = iso(now-(5+R()*200)*D);
  const p = ins('Person',{cohort_import_id:null,full_name:first+' '+String.fromCharCode(65+Math.floor(R()*26)),phone:'+91 9'+String(Math.floor(R()*1e9)).padStart(9,'0'),gender,
    birth_date:`${by}-${String(bm).padStart(2,'0')}-${String(1+Math.floor(R()*27)).padStart(2,'0')}`,city:o.city||g.city||pick(CITIES.map(c=>c[0]),R),occupation:o.occupation||g.occ,attributes:attrs,
    upi_vpa:first.toLowerCase()+Math.floor(R()*900+100)+'@'+pick(['okaxis','ybl','paytm','okhdfcbank','oksbi'],R),
    aadhaar_verified_at:(g.aadhaar||R()<0.6)?T0:null, linkedin_verified_at:g.linkedin?T0:(R()<0.25?T0:null), upi_verified_at:T0});
  assignSegments(p);
  return p;
}
function seedPanel(){
  const now=Date.now(), D=86400000;
  rows('Person',p=>!p.cohort_import_id).forEach(p=>{
    const a=p.attributes; if(a.segments) return;
    a.workouts_per_week=Math.floor(RNG()*6); if(personAge(p)>27&&RNG()<0.35) a.kids_under_10=1+Math.floor(RNG()*2);
    a.source='seed'; a.joined_at=iso(now-(120+RNG()*400)*D); a.quality_score=62+Math.floor(RNG()*36); a.studies_30d=Math.floor(RNG()*3);
    assignSegments(p);

}

function panelEligible(p){ const a=p.attributes||{}; return (a.quality_score??80)>=60 && (a.studies_30d??0)<4; }

audienceBase = function(src){ return src.audience_source==='voqiva_panel'||!src.audience_source ? rows('Person',p=>!p.cohort_import_id&&panelEligible(p)) : _ab(src); };

// ---------- budget with recruitment boost ----------
const _sb = studyBudget;
studyBudget = function(s){ const b=_sb(s); b.boost = s.launched_at?0:(s.recruitment_boost||0)*BOOST_CPA; b.total += b.boost; return b; };
function genMatching(s){
  const crits = critRows(s.id);
  const seg = crits.find(c=>c.attribute==='segment'); const key = seg? (Array.isArray(seg.value)?seg.value[0]:seg.value) : 'gen_z';
  for(let i=0;i<8;i++){
    const o={source:segByKey(key)?pick(SEG_GEN[key](Math.random).src,Math.random):'meta_ads',joinedNow:true,rng:Math.random};
    crits.forEach(c=>{
      if(c.attribute==='gender'&&c.operator==='eq') o.gender=c.value;
      if(c.attribute==='age'&&c.operator==='between') o.age=c.value[0]+Math.floor(Math.random()*(c.value[1]-c.value[0]+1));
      if(c.attribute==='industry'&&c.operator==='in'){ o.industry=pick(c.value,Math.random); if(INDUSTRY_JOBS[o.industry]) o.occupation=pick(INDUSTRY_JOBS[o.industry],Math.random); }
      if(['d2c_fashion_orders_60d','quick_commerce_orders_30d'].includes(c.attribute)) (o.attrs=o.attrs||{})[c.attribute]=Number(c.value)+1;
    });
    const cities = crits.filter(c=>c.attribute==='city'); if(cities.length) o.city = pick(cities.map(c=>c.value),Math.random);
    const p = makePanelist(key,o); p.attributes.quality_score=Math.max(70,p.attributes.quality_score); p.attributes.studies_30d=0;
    if(matchesAll(p,crits)) return p;
    delWhere('Person',x=>x.id===p.id);
  }
  return null;
}
function launchStudy(s){
  const boost = s.recruitment_boost||0;
  if(boost>0){
    let made=0; for(let i=0;i<boost;i++){ if(genMatching(s)) made++; }
    ins('WalletTransaction',{workspace_id:s.workspace_id,study_id:s.id,kind:'recruitment_boost',amount_inr:-boost*BOOST_CPA,created_at:iso(Date.now())});
    upd('Study',s.id,{recruitment_boost:0});
  }
  return launchStudyCore(s);
}

// ---------- study stepper (goal-gradient) ----------
function studyStepper(s, cur){
  const steps = [['ask','Ask'],['review','Review'],['live','Live'],['insights','Insights'],['act','Act']];
  const st = s ? studyStatus(s) : 'new';
  const reached = !s ? 0 : st==='draft' ? 1 : s.synthesized_at ? 4 : 2;
  const href = { review: s&&st==='draft'?'#plan-'+s.id:null, live: s&&s.launched_at?'#live-'+s.id:null, insights: s&&s.synthesized_at?'#report-'+s.id:null, act: s&&s.synthesized_at?'#actions-'+s.id:null };
  const curI = steps.findIndex(x=>x[0]===cur);
  return `<nav class="stepper-nav" aria-label="Study progress"><span class="small muted">Step ${curI+1} of 5</span><ol>${steps.map(([k,l],i)=>{
    const state = i===curI?'cur':i<=reached?'done':'todo';
    const inner = `<span class="sn">${state==='done'&&i!==curI?ic('check'):i+1}</span>${l}`;
    return `<li class="${state}">${href[k]&&i!==curI?`<a href="${href[k]}">${inner}</a>`:`<span>${inner}</span>`}</li>`; }).join('')}</ol></nav>`;
}

let DICT_ON = false, DICT_BASE = '';
const ACT = {
  menu(){ document.getElementById('rail').classList.toggle('open'); },
  'new-study'(){ ndInit(); go('new'); },
  try(a){ ndInit({objective:byId('PromptTemplate',a.dataset.id).prompt_text}); go('new'); },
  'home-tab'(a){ ui.homeTab=a.dataset.k; render(); },
  starter(a){ ui.nd.objective = byId('PromptTemplate',a.dataset.id).prompt_text; ui.nd.removed=[]; render(); const t=document.getElementById('nd-obj'); if(t){ t.focus(); } },
  'nd-chip-x'(a){ const k=a.dataset.k; const i=ui.nd.custom.findIndex(c=>ckey(c)===k); if(i>=0) ui.nd.custom.splice(i,1); else ui.nd.removed.push(k); updateNewSide(); },
  'rule-open'(a){ ui.addRule=a.dataset.scope; render(); const f=document.getElementById('rule-val'); if(f) f.focus(); },
  'rule-cancel'(){ ui.addRule=false; render(); },
  async dictate(){
    if(!DICT) return;
    const btn=document.getElementById('dict-btn');
    if(DICT_ON){ try{ await DICT.stop(); }catch(e){} return; }
    DICT_BASE = ui.nd.objective ? ui.nd.objective.replace(/\s*$/,' ') : '';
    try{

// ---------- helpers for import / text exports ----------
function parseCSV(text){
  const out=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'&&text[i+1]==='"'){ f+='"'; i++; } else if(c==='"') q=false; else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); f=''; if(row.some(x=>x.trim())) out.push(row); row=[]; } else f+=c; }
  row.push(f); if(row.some(x=>x.trim())) out.push(row);
  if(out.length<2) return [];
  const h=out[0].map(x=>x.trim().toLowerCase().replace(/\s+/g,'_'));
  return out.slice(1).map(r=>{ const o={}; h.forEach((k,i)=>o[k]=(r[i]||'').trim()); return o; });
}
function importPeople(ci, list){
  const STD=['full_name','name','phone','mobile','gender','birth_date','dob','city','occupation','upi_vpa'];
  let n=0;
  list.forEach(r=>{ const name=r.full_name||r.name, phone=r.phone||r.mobile; if(!name||!phone) return;
    const g=String(r.gender||'').toLowerCase(); const attrs={}; Object.keys(r).forEach(k=>{ if(!STD.includes(k)&&r[k]!=='') attrs[k]=isNaN(+r[k])?r[k]:+r[k]; });
    const bd=r.birth_date||r.dob; const d=bd&&!isNaN(new Date(bd))?new Date(bd).toISOString().slice(0,10):null;
    ins('Person',{cohort_import_id:ci.id,full_name:name,phone:String(phone),gender:/^f/.test(g)?'female':/^m/.test(g)?'male':g?'other':null,birth_date:d,city:r.city?(CITY_ALIASES[r.city.toLowerCase()]||r.city):null,occupation:r.occupation||null,attributes:attrs,upi_vpa:r.upi_vpa||null,aadhaar_verified_at:null,linkedin_verified_at:null,upi_verified_at:null});
    n++; });
  return n;
}
function reportText(s){
  const N=completedOf(s.id).length;
  return `${s.title} — Voqiva insights (${N} interviews)\n\n${s.headline}\n\n${s.summary}\n\n`+
    rows('Theme',t=>t.study_id===s.id).sort((a,b)=>a.position-b.position).map(t=>{ const m=themeStats(t); const ev=rows('Evidence',e=>e.theme_id===t.id&&e.is_featured)[0];
      return `• ${t.name} (${CAT_LABEL[t.category]}, ${t.evidence_level}): ${t.headline} — ${m.participant_count}/${N}${ev?`\n  “${ev.quote}”`:''}`; }).join('\n');
}
function briefText(s){
  return `# Action plan: ${s.title}\n\n> ${s.headline}\n\n`+rows('Recommendation',r=>r.study_id===s.id).sort((a,b)=>a.position-b.position).map(r=>{
    const ms=rows('Metric',m=>m.recommendation_id===r.id).map(m=>`- ${m.label}: ${fmtMetric(m)} (${m.participant_count==null?'projection':'measured, n='+m.participant_count})`).join('\n');
    return `## [${WS_LABEL[r.workstream]}] ${r.title}\nImpact: ${r.impact} · Effort: ${r.effort}${r.owner_team?' · Owner: '+r.owner_team:''} · Status: ${r.status}\n\n${r.body_md}${ms?'\n\n'+ms:''}`; }).join('\n\n');
}

  'seg-study'(a){ ndInit({source:'voqiva_panel',segments:[a.dataset.k],segTouched:true,step:2}); go('new'); },
  'panel-seg'(a){ ui.panelSeg=a.dataset.k; ui.showPeople=40; render(); },
  'apply-rate'(a){ upd('Study',a.dataset.id,{incentive_inr:Number(a.dataset.r)}); save(); render(); },
  boost(a){ upd('Study',a.dataset.id,{recruitment_boost:Number(a.dataset.n)}); save(); render(); }
});
Object.assign(SUBMIT, {
  'panel-grow'(){ const k=document.getElementById('pg-seg').value, src=document.getElementById('pg-src').value, n=Math.max(1,Math.min(200,parseInt(document.getElementById('pg-n').value)||25));
    for(let i=0;i<n;i++) makePanelist(k,{source:src,joinedNow:true,rng:Math.random});
    save(); ui.panelSeg=k; render(); toast(`${n} new ${segByKey(k).name} panelists joined via ${SOURCE_LABEL[src]} (simulated).`); }
});
// ---------- v4 UX actions ----------
const _copySnippet = ACT['copy-snippet'], _recStatus = ACT['rec-status'];
Object.assign(ACT, {
  'lp-demo'(){ meta().onboarded = true; save(); go('home'); },
  'lp-jump'(a){ const el=document.getElementById('lp-'+a.dataset.k); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); if(a.dataset.k==='start'){ const f=document.getElementById('su-name'); if(f) setTimeout(()=>f.focus({preventScroll:true}),400); } },
  'checklist-hide'(){ meta().checklist_dismissed = true; save(); render(); },
  'copy-snippet'(a){ meta().optin_done = true; save(); _copySnippet(a); render(); },
  'rec-status'(a){ meta().acted = true; _recStatus(a); },
  'reveal-close'(){ ui.reveal=null; render(); const t=document.querySelector('.tabs'); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); },
  'reveal-done'(){ ui.reveal=null; },
  'plan-custom'(){ ui.planCustom=!ui.planCustom; render(); },
  'nd-next'(){ const nd=ui.nd; if(nd.objective.trim().length<20){ toast('Describe what you want to learn in at least one full sentence.'); const t=document.getElementById('nd-obj'); if(t) t.focus(); return; } nd.step=2; render(); const el=document.getElementById('nd-aud'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
});
Object.assign(SUBMIT, {
  signup(){
    const name=document.getElementById('su-name').value.trim(), brand=document.getElementById('su-brand').value.trim(), email=document.getElementById('su-email').value.trim();
    if(!name||!brand) return;
    upd('User',ui.user,{full_name:name,email:email||me().email}); upd('Workspace',ui.ws,{name:brand});
    const v=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
    Object.assign(meta(),{store_url:v('su-store'),monthly_orders:v('su-orders'),whatsapp:v('su-wa'),dpdp_ack:true,onboarded:true,signup_at:iso(Date.now()),checklist_dismissed:false,optin_done:false,acted:false});
    save(); go('home'); toast('Welcome to Voqiva, '+name.split(' ')[0]+'. Your workspace is ready.');
  }
});
