<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Voqiva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: fixed left rail + sticky top bar; main column of cards on a faintly indigo-tinted ground */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface-2:#F7F6F3; --surface-3:#EFEDE8; --line:#E7E4DE;
  --fg:#16181A; --muted:#5E6266; --faint:#8B8F93;
  --accent:#0F5662; --accent-2:#0A4550; --accent-fg:#FFFFFF; --accent-soft:#E2EFF0;
  --ok:#1E7A4C; --ok-soft:#E5F4EA; --ok-strong:#34A866;
  --warn:#9A5A06; --warn-soft:#FDF1DE; --bad:#B3261E; --bad-soft:#FBE5E3;
  --dash:#C9C3B8; --wa-bg:#EFEAE2; --wa-out:#D9FDD3; --live-dot:#E8A33D;
  --shadow:none;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
svg[aria-hidden]{width:16px;height:16px;flex:none}
.avatar svg{width:22px;height:22px}
.nav svg{width:18px;height:18px}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,36px);line-height:1.15}
h2{font-size:22px;line-height:1.25}
h3{font-size:18px;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.brand b{font-family:var(--display);font-size:20px}
.tag-pro{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--fg);text-decoration:none;font-weight:500}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent);color:var(--accent-fg)}
.nav .pill{margin-left:auto}
.nav svg{width:18px;height:18px;flex:none}
.rail .spacer{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.content{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;display:flex;flex-direction:column;gap:22px}
.menu-btn{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hide-sm{display:none!important}
}
.ws-switch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:600;font-family:var(--display);font-size:16px}
.ws-switch select{border:0;background:transparent;font:inherit;cursor:pointer;max-width:200px}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;color:var(--muted)}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;max-height:360px;overflow:auto;z-index:30}
.search-res a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg)}
.search-res a:hover{background:var(--surface-2)}
.wallet-chip{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;text-decoration:none;color:var(--fg);font-weight:600}
.user{display:flex;align-items:center;gap:10px;margin-left:auto}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* atoms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.card.tint{background:var(--surface-2);box-shadow:none}
.well{background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.solid{background:var(--accent);color:var(--accent-fg)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:13px 22px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.link{color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
input.field,select.field,textarea.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea.field{resize:vertical;min-height:90px}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.kpi .big{font-family:var(--display);font-size:38px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .big small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.crumbs b{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:13.5px;border:0;cursor:pointer}
.chip.plain{background:var(--surface-2);color:var(--fg)}
.chip .x{opacity:.6;font-weight:700}
.chip .x:hover{opacity:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.quote{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:14px 16px;display:flex;gap:12px}
.quote.friction{border-left-color:var(--warn)} .quote.pos{border-left-color:var(--ok)}
.quote p{font-family:var(--display);font-style:italic;font-size:15.5px;line-height:1.5}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100vw - 32px)}
.ai-chip{font-size:11.5px}
.hero{background:linear-gradient(135deg,var(--surface) 55%,color-mix(in srgb,var(--ok-soft) 70%,var(--surface)))}
.prompt-box{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.prompt-box input{flex:1;border:0;background:transparent;padding:8px 0;min-width:0}
.prompt-box input:focus{outline:none}
.q-card{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:14px 16px}
.q-card.screener{border-left-color:var(--muted)} .q-card.slider{border-left-color:var(--ok)} .q-card.choice{border-left-color:var(--warn)}
.q-card textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px}
.sess{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:10px}
.sess.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sess.live{border-left:3px solid var(--accent)}
.bubble{padding:12px 14px;border-radius:12px;max-width:88%}
.bubble.mod{background:var(--surface-2)}
.bubble.par{background:var(--accent);color:var(--accent-fg);margin-left:auto}
.transcript{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.swatch{height:46px;border-radius:8px}
.side-sticky{position:sticky;top:76px}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)!important}.side-sticky{position:static}}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.md ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.md li{background:var(--surface-2);border-radius:9px;padding:10px 12px}
.spark{display:block;width:100%;height:auto}
.stepper{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.stepper button{width:32px;height:32px;border:0;background:transparent;border-radius:8px;font-size:18px;cursor:pointer}
.stepper button:hover{background:var(--surface-2)}
.stepper input{width:56px;text-align:center;border:0;background:transparent;font-family:var(--display);font-size:22px;font-weight:600}
.banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.banner>div{flex:1;min-width:240px}
.pill.buy{background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:600}
.pill.buy svg{color:var(--ok);width:13px;height:13px}
.vn{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.vn svg{width:22px;height:22px;padding:5px;border-radius:50%;background:var(--accent);color:var(--accent-fg);flex:none}
.vn.dark svg{background:var(--accent-fg);color:var(--accent)}
.vn .bars{display:flex;align-items:center;gap:2px;height:20px;flex:1;min-width:60px}
.vn .bars i{width:3px;border-radius:2px;background:currentColor;opacity:.55}
.hyp{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn)}
.footer-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:4}
.wave{display:flex;gap:3px;align-items:center;height:28px}
.wave i{width:4px;border-radius:2px;background:var(--accent);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none}}

/* ===== v4 UX system ===== */
/* badges: tag = outline · status = dot + coloured text · verification = check badge · category = tinted */
.pill{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.pill.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.pill.ok,.pill.warn,.pill.bad{background:transparent;border-color:transparent;padding-left:0;padding-right:0;font-weight:600}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill.ok:not(:has(.dot)):not(:has(svg))::before,.pill.warn:not(:has(.dot)):not(:has(svg))::before,.pill.bad:not(:has(.dot)):not(:has(svg))::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.ok:has(svg){border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);padding:2px 8px;background:color-mix(in srgb,var(--ok-soft) 55%,transparent)}
.pill.buy{background:var(--surface);border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));color:var(--fg)}
.pill.solid{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pill.hyp{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn)}
.btn:active{transform:translateY(1px)}
.btn.accent{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.accent:hover{background:var(--accent-soft)}
/* grouped nav */
.nav-group{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:14px 12px 4px}
.nav .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.nav.on .count{color:inherit;opacity:.85}
/* clickable cards (Fitts) */
.card-link{text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.card-link:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* stepper */
.stepper-nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper-nav ol{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper-nav li>a,.stepper-nav li>span{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;font-weight:600;font-size:13px;text-decoration:none;color:var(--faint);border:1px solid transparent}
.stepper-nav .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--surface-3);color:var(--muted)}
.stepper-nav .sn svg{width:12px;height:12px}
.stepper-nav li.done>a,.stepper-nav li.done>span{color:var(--fg)}
.stepper-nav li.done .sn{background:var(--ok);color:#fff}
.stepper-nav li.done>a:hover{border-color:var(--line);background:var(--surface)}
.stepper-nav li.cur>span{color:var(--accent);background:var(--accent-soft)}
.stepper-nav li.cur .sn{background:var(--accent);color:var(--accent-fg)}
/* skeletons */
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.3s ease-in-out infinite}
.skel-row{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* checklist */
.checklist{border-color:var(--accent)}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cl li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px}
.cl li.next{background:var(--accent-soft)}
.cl .sn{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.cl li.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.cl li.done .lbl2{color:var(--muted);text-decoration:line-through}
.cl .sn svg{width:12px;height:12px}
.cl .lbl2{flex:1;font-weight:500}
/* anchor */
.anchor{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.anchor s{color:var(--muted);font-weight:600}
/* reveal (peak-end) */
.reveal{background:var(--fg);color:var(--bg);border-radius:18px;padding:clamp(24px,4vw,44px);gap:18px}
.reveal-h{font-size:clamp(26px,3.4vw,40px);line-height:1.2;max-width:28ch;color:var(--bg)}
.reveal-stats{gap:clamp(18px,4vw,48px)}
.reveal-stats div{display:flex;flex-direction:column}
.reveal-stats b{font-family:var(--display);font-size:34px;font-weight:600}
.reveal-stats span{font-size:13px;opacity:.75}
.reveal .btn:not(.primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (prefers-reduced-motion:no-preference){.reveal{animation:rv .5s ease-out}}
@keyframes rv{from{opacity:0;transform:translateY(8px)}}
/* loss banner */
.banner.loss{border-left:4px solid var(--bad)}
/* mobile CTA (thumb zone) */
.mcta{display:none}
@media (max-width:760px){.mcta{display:block;position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}.mcta .btn{width:100%}}
/* landing */
body.landing .rail,body.landing .top{display:none}
body.landing .shell{grid-template-columns:minmax(0,1fr)}
body.landing .content{max-width:1120px;margin:0 auto}
.lp{display:flex;flex-direction:column;gap:56px}
.lp-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lp-nav button.link{font-weight:500}
.lp-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:center}

function mkRng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = Math.random;
function uid(){
  if (RNG===Math.random && window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const h=()=>Math.floor(RNG()*16).toString(16);
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>c==='x'?h():(8+Math.floor(RNG()*4)).toString(16));
}
const pick = (arr,r=RNG)=>arr[Math.floor(r()*arr.length)];

function initials(n){ return String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }

const KNOWN_ATTRS = ['gender','age','city','industry','d2c_fashion_orders_60d','quick_commerce_orders_30d','skincare_buyer','upi_verified','aadhaar_verified','linkedin_verified'];
function personValue(p, attr){
  switch(attr){
    case 'gender': return p.gender;
    case 'age': return personAge(p);
    case 'city': return p.city;
    case 'upi_verified': return p.upi_verified_at? true : false;
    case 'aadhaar_verified': return p.aadhaar_verified_at? true : false;
    case 'linkedin_verified': return p.linkedin_verified_at? true : false;
    default: return p.attributes? p.attributes[attr] : undefined;
  }
}
function critPass(p, c){
  if(!KNOWN_ATTRS.includes(c.attribute)) return true;      // free-text rules are checked by the screener question
  const v = personValue(p, c.attribute);
  if(v===undefined || v===null) return true;                // imported customers may lack a field
  const x = c.value;
  switch(c.operator){
    case 'eq': return String(v).toLowerCase()===String(x).toLowerCase();
    case 'in': return (Array.isArray(x)?x:[x]).map(s=>String(s).toLowerCase()).includes(String(v).toLowerCase());
    case 'between': return Array.isArray(x) && v>=x[0] && v<=x[1];
    case 'gte': return Number(v)>=Number(x);
  }
  return true;
}
function matchesAll(p, crits){
  // city rules with quotas are alternatives (OR) — every other rule must hold (AND)
  const cityRules = crits.filter(c=>c.attribute==='city'&&c.operator==='eq');
  const others = crits.filter(c=>!(c.attribute==='city'&&c.operator==='eq'));
  if(cityRules.length && !cityRules.some(c=>critPass(p,c))) return false;
  return others.every(c=>critPass(p,c));
}
function audienceBase(src){
  if(src.audience_source==='cohort_import') return rows('Person',p=>p.cohort_import_id===src.cohort_import_id);
  if(src.audience_source==='parent_study'){ const ids=new Set(completedOf(src.parent_study_id).map(s=>s.person_id)); return rows('Person',p=>ids.has(p.id)); }
  return rows('Person',p=>!p.cohort_import_id);
}
function feasibility(src, crits){
  const base = audienceBase(src);
  const m = base.filter(p=>matchesAll(p,crits));
  return {base:base.length, match:m.length, people:m};
}
function estTurnaround(n, mins){ // recruitment + interviews in parallel waves of 8 + synthesis
  const waves = Math.ceil((n||1)/8);
  return 35*60000 + waves*((mins||10)+6)*60000 + 20*60000;
}

// ---------- fieldwork (rule-based generator, used for seeds and as AI fallback) ----------
function poolFor(scriptKey, q){
  const sc = SCRIPTS[scriptKey];
  if(sc && sc.pools[q.position]) return sc.pools[q.position];
  if(q.input_type==='slider'){ const c=q.config||{}; const lo=c.min||0, hi=c.max||100, st=c.step||1; return [0.3,0.5,0.6,0.75,0.9].map(f=>({v:Math.round((lo+(hi-lo)*f)/st)*st,t:'Somewhere around there feels right to me for a first purchase.',tags:[],s:0})); }
  if(q.input_type==='choice'){ const o=(q.config&&q.config.options)||['Yes','No']; return o.map(x=>({v:[x],t:x+', mainly.',tags:[],s:0})); }
  return GENERIC.voice;
}
function signalMapFor(scriptKey){ return (SCRIPTS[scriptKey]&&SCRIPTS[scriptKey].signalMap) || GENERIC.signalMap; }
function writeTurns(session, q, modText, parText, atMs, value){
  const m = ins('TranscriptTurn',{session_id:session.id,question_id:q.id,speaker:'moderator',start_ms:atMs,text:modText});
  const pStart = atMs + 3000 + modText.length*60;
  ins('TranscriptTurn',{session_id:session.id,question_id:q.id,speaker:'participant',start_ms:pStart,text:parText});
  if(value!==undefined && value!==null && (q.input_type==='slider'||q.input_type==='choice')) ins('Answer',{session_id:session.id,question_id:q.id,value_json:{value}});
  return pStart + 15000 + parText.length*250 + Math.floor(RNG()*40000);
}
function genSessionFromPools(session, questions, scriptKey, opts){
  opts = opts||{};
  const ov = opts.override||{};
  const existing = new Set(rows('TranscriptTurn',t=>t.session_id===session.id&&t.speaker==='participant').map(t=>t.question_id));
  let at = opts.startMs!=null? opts.startMs : (rows('TranscriptTurn',t=>t.session_id===session.id).reduce((a,t)=>Math.max(a,t.start_ms+8000),2000));
  let score=0; const tags=new Set();
  const upTo = opts.upTo || questions.length;
  for(const q of questions){
    if(q.position>upTo) break;
    if(existing.has(q.id)) continue;
    const pool = poolFor(scriptKey,q);
    const e = ov[q.position]!=null ? pool[ov[q.position]] : pool[Math.floor(RNG()*pool.length)];
    at = writeTurns(session, q, q.prompt, e.t, at, e.v);
    score += e.s||0; (e.tags||[]).forEach(t=>tags.add(t));
  }
  if(opts.currentQ){ ins('TranscriptTurn',{session_id:session.id,question_id:opts.currentQ.id,speaker:'moderator',start_ms:at,text:opts.currentQ.prompt}); }
  const sm = signalMapFor(scriptKey);
  [...tags].slice(0,4).forEach(t=>{ if(sm[t]) ins('Signal',{session_id:session.id,label:sm[t][0],polarity:sm[t][1]}); });
  return {score, at, tags};
}
function fieldSeed(s, scriptKey, questions, people, o){
  DB._meta.scripts[s.id] = scriptKey;
  const live = new Set(o.live||[]), queued = new Set(o.queued||[]);
  let qualified = 0;
  people.forEach((p,i)=>{
    const fraud = s.audience_source==='voqiva_panel' && !p.upi_verified_at && !p.aadhaar_verified_at;
    const sess = ins('Session',{study_id:s.id,person_id:p.id,screen_result:fraud?'fraud':'qualified',started_at:null,ended_at:null,recording_url:null,sentiment:null,summary:null,payout_status:null,payout_ref:null});
    if(fraud) return;
    qualified++;
    if(queued.has(i)) return;
    const start = o.t0 + (12 + i*3.6 + RNG()*4)*60000;
    sess.started_at = iso(start);
    const ov = (o.overrides||{})[p.id]||{};
    if(live.has(i)){
      const upTo = i%2? 1 : 2;
      genSessionFromPools(sess, questions, scriptKey, {override:ov, upTo, startMs:2000, currentQ:questions[upTo]});
      sess.payout_status='pending';
      return;
    }
    const r = genSessionFromPools(sess, questions, scriptKey, {override:ov, startMs:2000});
    finishSession(sess, s, start + r.at + 15000, r.score>0?'positive':r.score<0?'negative':'neutral', ov.summary || autoSummary(sess));
  });
}
function autoSummary(sess){
  const t = rows('TranscriptTurn',x=>x.session_id===sess.id&&x.speaker==='participant').sort((a,b)=>b.text.length-a.text.length)[0];
  return t? t.text.slice(0,170) : '';
}
function finishSession(sess, study, endMs, sentiment, summary){
  sess.ended_at = iso(endMs); sess.sentiment = sentiment; sess.summary = summary;
  sess.payout_status = 'paid'; sess.payout_ref = payoutRef(study.reward_type);
}

// ---------- synthesis writer (shared by AI and rule-based paths) ----------
function writeSynthesis(study, R){
  // clear previous
  const oldThemes = rows('Theme',t=>t.study_id===study.id).map(t=>t.id);
  delWhere('Evidence',e=>oldThemes.includes(e.theme_id));
  delWhere('Theme',t=>t.study_id===study.id); delWhere('Recommendation',r=>r.study_id===study.id); delWhere('Metric',m=>m.study_id===study.id);
  const done = completedOf(study.id); const N = done.length || 1;
  let tpos=0;
  const made = R.themes.map(t=>{
    if(!t.support || t.support.size===0) return null;
    const i = tpos++;
    const verified = t.support.size>=3 && t.support.size/N>=0.4;
    const th = ins('Theme',{study_id:study.id,position:i+1,category:t.category,name:t.name,headline:t.headline,body:t.body,evidence_level:verified?'verified':'emerging',supporting_session_ids:[...t.support]});
    t.evidence.slice(0,6).forEach((e,j)=>{
      ins('Evidence',{theme_id:th.id,session_id:e.session_id,start_ms:e.turn.start_ms,end_ms:e.turn.start_ms+15000+e.turn.text.length*250,quote:e.turn.text,is_featured:j===0});
    });
    ins('Metric',{study_id:study.id,theme_id:th.id,recommendation_id:null,position:1,label:t.metric||t.name,description:null,participant_count:t.support.size,value:Math.round(t.support.size/N*1000)/10,unit:'pct',swatch_hex:null});
    th._support = t.support;
    return th;
  });
  const themes = made.filter(Boolean);
  // headline metrics
  let pos=1;
  const byCat = c=>themes.find(t=>t.category===c);
  const firstT = themes[0], fr = byCat('friction');
  [firstT, fr && fr!==firstT ? fr : themes[1]].filter(Boolean).forEach(t=>{
    const m = one('Metric',x=>x.theme_id===t.id);
    ins('Metric',{study_id:study.id,theme_id:null,recommendation_id:null,position:pos++,label:m.label,description:t.name,participant_count:m.participant_count,value:m.value,unit:'pct',swatch_hex:null});
  });
  const pq = questionsOf(study.id).find(q=>q.input_type==='slider' && (q.config||{}).unit==='inr');
  if(pq){
    const vals = rows('Answer',a=>a.question_id===pq.id && done.some(s=>s.id===a.session_id)).map(a=>Number(a.value_json.value)).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
    if(vals.length){ const med = vals[Math.floor((vals.length-1)/2)];
      ins('Metric',{study_id:study.id,theme_id:null,recommendation_id:null,position:pos++,label:'Median willingness to pay',description:'From '+vals.length+' slider answers to “'+pq.section+'”',participant_count:vals.length,value:med,unit:'inr',swatch_hex:null}); }
  } else if(themes[2]) {
    const m = one('Metric',x=>x.theme_id===themes[2].id);
    ins('Metric',{study_id:study.id,theme_id:null,recommendation_id:null,position:pos++,label:m.label,description:themes[2].name,participant_count:m.participant_count,value:m.value,unit:'pct',swatch_hex:null});
  }
  // colour swatches from a choice question
  if(R.swatches){
    const cq = questionsOf(study.id).find(q=>q.input_type==='choice' && (q.config&&q.config.options||[]).some(o=>R.swatches[o]));
    const pref = themes.find(t=>t.category==='preference');
    if(cq && pref){
      const ans = rows('Answer',a=>a.question_id===cq.id); const n=ans.length||1;
      cq.config.options.filter(o=>R.swatches[o]).map(o=>({o,c:ans.filter(a=>(a.value_json.value||[]).includes(o)).length})).sort((a,b)=>b.c-a.c).slice(0,4)
        .forEach((x,i)=>ins('Metric',{study_id:study.id,theme_id:pref.id,recommendation_id:null,position:2+i,label:x.o,description:'chose it',participant_count:x.c,value:Math.round(x.c/n*100),unit:'pct',swatch_hex:R.swatches[x.o]}));
    }
  }
  // recommendations
  R.recs.forEach((r,i)=>{
    const th = r.theme!=null ? made[r.theme] : null;
    const rec = ins('Recommendation',{study_id:study.id,theme_id:th?th.id:null,position:i+1,workstream:r.workstream,title:r.title,body_md:r.body_md,impact:r.impact||'medium',effort:r.effort||'medium',status:'proposed',track:r.track||null,owner_team:r.owner_team||null,external_ref:null,asset_url:null});
    let mp=1;
    if(r.willingnessAt && pq){
      const vals = rows('Answer',a=>a.question_id===pq.id).map(a=>Number(a.value_json.value));
      const ok = vals.filter(v=>v>=r.willingnessAt).length;
      if(vals.length) ins('Metric',{study_id:study.id,theme_id:null,recommendation_id:rec.id,position:mp++,label:'Participant willingness at '+inr(r.willingnessAt),description:ok+' of '+vals.length+' would pay this or more',participant_count:ok,value:Math.round(ok/vals.length*100),unit:'pct',swatch_hex:null});
    }
    (r.projected||[]).forEach(m=>{ if(m.value!=null) ins('Metric',{study_id:study.id,theme_id:null,recommendation_id:rec.id,position:mp++,label:m.label,description:m.description||'Projection, not measured in interviews',participant_count:null,value:m.value,unit:m.unit,swatch_hex:null}); });
  });
  // evidence coverage = share of completed interviews that support at least one verified theme
  const covered = new Set(); themes.filter(t=>t.evidence_level==='verified').forEach(t=>t._support.forEach(id=>covered.add(id)));
  themes.forEach(t=>delete t._support);
  upd('Study',study.id,{headline:R.headline,summary:R.summary,confidence_pct:Math.round(covered.size/N*1000)/10,synthesized_at:iso(R.at||Date.now())});
}

function synthFromScript(study, key, at){
  const sc = SCRIPTS[key]; const done = completedOf(study.id);
  const qs = questionsOf(study.id);
  const themes = sc.themes.map(th=>{
    const labels = new Set(th.tags.map(t=>sc.signalMap[t][0]));
    const texts = new Set(); Object.values(sc.pools).flat().forEach(e=>{ if((e.tags||[]).some(t=>th.tags.includes(t))) texts.add(e.t); });
    const support = new Set(); const evidence=[];
    done.forEach(s=>{
      const sig = rows('Signal',g=>g.session_id===s.id&&labels.has(g.label));
      const turns = rows('TranscriptTurn',t=>t.session_id===s.id&&t.speaker==='participant'&&texts.has(t.text));
      if(sig.length||turns.length) support.add(s.id);
      if(turns.length) evidence.push({session_id:s.id,turn:turns.sort((a,b)=>b.text.length-a.text.length)[0]});
    });
    // put the longest, most specific quote first
    const seen=new Set(); const ev = evidence.sort((a,b)=>b.turn.text.length-a.turn.text.length).filter(e=>{ if(seen.has(e.turn.text)) return false; seen.add(e.turn.text); return true; });
    return {category:th.category,name:th.name,headline:th.headline,body:th.body,metric:th.metric,support,evidence:ev};
  });
  // keep script theme indices stable for recs
  const idx = sc.themes.map(t=>themes.findIndex(x=>x.name===t.name));
  writeSynthesis(study,{headline:sc.headline,summary:sc.summary,themes,swatches:sc.swatches,at,
    recs:sc.recs.map(r=>Object.assign({},r,{theme:r.theme==null?null:idx[r.theme]}))});
}
function synthGeneric(study){
  const done = completedOf(study.id); const groups={};
  done.forEach(s=>rows('Signal',g=>g.session_id===s.id).forEach(g=>{ (groups[g.label]=groups[g.label]||{polarity:g.polarity,ids:new Set()}).ids.add(s.id); }));
  const catOf = p=> p==='critical'||p==='negative' ? 'friction' : p==='positive' ? 'buying_driver' : 'preference';
  const themes = Object.entries(groups).sort((a,b)=>b[1].ids.size-a[1].ids.size).slice(0,5).map(([label,g])=>{
    const evidence = [...g.ids].map(id=>({session_id:id,turn:rows('TranscriptTurn',t=>t.session_id===id&&t.speaker==='participant').sort((a,b)=>b.text.length-a.text.length)[0]})).filter(e=>e.turn);
    return {category:catOf(g.polarity),name:label,headline:label+' came up in '+g.ids.size+' of '+done.length+' interviews',body:'Rule-based grouping of the signals tagged during interviews. Run AI synthesis for a written interpretation.',metric:'Mention '+label.toLowerCase(),support:g.ids,evidence};
  });
  writeSynthesis(study,{headline:'Top signal: '+(themes[0]?themes[0].name:'no recurring signal')+'.',summary:'Quick synthesis from interview signals. AI synthesis was unavailable, so the themes below are grouped by tag rather than written up.',themes,recs:[]});
}

// ---------- quick local parse for the "Live parsing" panel (no AI, no cost) ----------
const CITY_ALIASES = {bengaluru:'Bengaluru',bangalore:'Bengaluru',blr:'Bengaluru',mumbai:'Mumbai',bombay:'Mumbai',pune:'Pune',delhi:'Delhi NCR',ncr:'Delhi NCR',gurgaon:'Delhi NCR',gurugram:'Delhi NCR',noida:'Delhi NCR',hyderabad:'Hyderabad',chennai:'Chennai',kolkata:'Kolkata',ahmedabad:'Ahmedabad',jaipur:'Jaipur',indore:'Indore'};
const DOMAINS = [[/shirt|officewear|apparel|kurta|tee|t-shirt|denim|menswear|fashion|khadi|linen/i,'D2C Apparel'],[/skin|serum|niacinamide|sunscreen|moisturi|beauty|hair/i,'D2C Beauty & Skincare'],[/snack|makhana|food|beverage|coffee|tea|protein|chocolate/i,'Food & Beverage'],[/checkout|cart|conversion|shopify|payment|app/i,'E-commerce Experience'],[/fintech|loan|credit|insurance|upi/i,'Fintech']];
function parseObjective(text){
  const t = text||''; const out={criteria:[]};
  out.domain = (DOMAINS.find(([r])=>r.test(t))||[0,'Consumer'])[1];
  if(/\b(men|male|guys|man)\b/i.test(t) && !/\bwomen\b/i.test(t)) out.criteria.push({attribute:'gender',operator:'eq',value:'male',label:'Men'});
  else if(/\b(women|female|girls|woman)\b/i.test(t) && !/\bmen\b/i.test(t)) out.criteria.push({attribute:'gender',operator:'eq',value:'female',label:'Women'});
  const age = t.match(/(?:aged?|ages?)\s*(\d{2})\s*(?:–|-|to)\s*(\d{2})/i) || t.match(/(\d{2})\s*(?:–|-|to)\s*(\d{2})\s*(?:yrs|years|year)/i);
  if(age) out.criteria.push({attribute:'age',operator:'between',value:[+age[1],+age[2]],label:'Ages '+age[1]+'–'+age[2]});
  const cities=[]; Object.keys(CITY_ALIASES).forEach(k=>{ if(new RegExp('\\b'+k+'\\b','i').test(t) && !cities.includes(CITY_ALIASES[k])) cities.push(CITY_ALIASES[k]); });
  if(cities.length){ const q = Math.floor(100/cities.length); cities.forEach((c,i)=>out.criteria.push({attribute:'city',operator:'eq',value:c,quota_pct:i===0?100-q*(cities.length-1):q,label:c})); }
  const pr = t.match(/₹\s?([\d,]+)\s*(?:–|-|to|and)\s*₹?\s?([\d,]+)/);
  if(pr) out.price=[+pr[1].replace(/,/g,''),+pr[2].replace(/,/g,'')];
  if(/fashion|apparel|shirt|officewear|menswear|wear/i.test(t)) out.criteria.push({attribute:'d2c_fashion_orders_60d',operator:'gte',value:2,label:'Buys D2C fashion online 2+ times in 60 days'});
  if(/blinkit|zepto|instamart|quick.?commerce/i.test(t)) out.criteria.push({attribute:'quick_commerce_orders_30d',operator:'gte',value:4,label:'4+ quick-commerce orders in 30 days'});
  const g = out.criteria.find(c=>c.attribute==='gender'), a=out.criteria.find(c=>c.attribute==='age');
  out.profile = [g?g.label:'All genders', a? a.label.replace('Ages ','')+' yrs':null].filter(Boolean).join(', ');
  out.cities = cities;
  out.segments = detectSegments(t);
  return out;
}

function planPrompt(nd, parsed){

  return `You are Voqiva's research planner. Voqiva runs AI-moderated qualitative research for Indian D2C and consumer brands.
Turn this business objective into a study plan.

OBJECTIVE:
${nd.objective}

AUDIENCE SOURCE: ${src}
AUDIENCE RULES ALREADY CONFIRMED BY THE USER (keep them, you may add more): ${JSON.stringify(nd.criteria.map(c=>({attribute:c.attribute,operator:c.operator,value:c.value,quota_pct:c.quota_pct||null,label:c.label})))}

RULES
- 4 to 6 questions. The first has kind "screener"; the rest "interview". Write every question in clear, simple English only (no Hindi or Hinglish words), the way a warm Indian moderator would say them aloud.
- input_type is one of: voice, voice_with_card, slider, choice, text.
  * slider only for a price or number, with config {"min":int,"max":int,"step":int,"unit":"inr"} (unit can be another word for non-money).
  * choice with config {"options":[3-6 short strings],"multi":true|false}.
  * voice_with_card with config {"card":"what the WhatsApp card shows"}.
  * otherwise config null.
- If the objective mentions a price range, include one slider over that range.
- Each question has a 2-4 word "section" and a "probe_goal" (what the moderator should dig into).
- criteria may only use these attributes: gender (eq "male"|"female"), age (between [min,max]), city (eq one city; one row per city with quota_pct summing to 100), industry (in a list from Tech, Consulting, Agency, FinTech, FMCG, Healthcare, Education, Retail, Student), d2c_fashion_orders_60d (gte n), quick_commerce_orders_30d (gte n), skincare_buyer (eq true), upi_verified (eq true), segment (in a list of audience keys: gen_z, college_students, working_professionals, young_parents, homemakers, tier2_shoppers, fitness, smb_owners, senior_leaders). Each criterion has a short human "label". For an imported cohort, keep criteria minimal.
- sample_size 10-40. incentive_inr is a fair amount for the interview length (typically 100-400). reward_type: upi_cash | amazon_voucher | myntra_voucher | mobile_recharge. language: always "english". methodology: whatsapp_voice (default for the brand's own customers) | voice_interview | survey | voice_plus_whatsapp. max_duration_min 5-20.

Reply with only this JSON:
{"title":"short study name","domain":"e.g. D2C Menswear","target_profile":"e.g. Men, 22–30 yrs","methodology":"...","sample_size":25,"incentive_inr":300,"reward_type":"upi_cash","language":"english","max_duration_min":10,
 "criteria":[{"attribute":"gender","operator":"eq","value":"male","quota_pct":null,"label":"Men"}],
 "questions":[{"kind":"screener","section":"...","prompt":"...","input_type":"voice","probe_goal":"...","config":null}]}`;
}

function sanitizePlan(p, nd){
  const Q = Array.isArray(p.questions)? p.questions.slice(0,8) : [];
  const okIT = ['voice','voice_with_card','slider','choice','text'];
  const crits = nd.criteria.slice();
  (Array.isArray(p.criteria)?p.criteria:[]).forEach(c=>{
    if(!c || !KNOWN_ATTRS.includes(c.attribute) || !['eq','in','between','gte'].includes(c.operator)) return;
    if(crits.some(x=>x.attribute===c.attribute && JSON.stringify(x.value)===JSON.stringify(c.value))) return;
    if(c.attribute!=='city' && crits.some(x=>x.attribute===c.attribute)) return;
    crits.push({attribute:c.attribute,operator:c.operator,value:c.value,quota_pct:c.quota_pct||null,label:String(c.label||c.attribute)});
  });
  const pick1=(v,list,d)=>list.includes(v)?v:d;
  return {
    title:String(p.title||'Untitled study').slice(0,90), domain:String(p.domain||''),
    methodology:pick1(p.methodology,['whatsapp_voice','voice_interview','survey','voice_plus_whatsapp'],nd.source==='voqiva_panel'?'voice_interview':'whatsapp_voice'),
    sample_size:Math.min(40,Math.max(5,parseInt(p.sample_size)||20)), incentive_inr:Math.min(2000,Math.max(50,parseInt(p.incentive_inr)||250)),
    reward_type:pick1(p.reward_type,['upi_cash','amazon_voucher','myntra_voucher','mobile_recharge'],'upi_cash'),
    language:'english', max_duration_min:Math.min(30,Math.max(3,parseInt(p.max_duration_min)||10)),
    criteria:crits,
    questions:Q.filter(q=>q&&q.prompt).map((q,i)=>({kind:i===0?'screener':'interview',section:String(q.section||'Question '+(i+1)).slice(0,40),prompt:String(q.prompt),input_type:pick1(q.input_type,okIT,'voice'),probe_goal:q.probe_goal?String(q.probe_goal):null,config:q.config&&typeof q.config==='object'?q.config:null}))
  };
}
async function generatePlan(nd, onProgress, signal){
  const parsed = parseObjective(nd.objective);
  let plan, note=null;
  try{
    const raw = await aiJSON(planPrompt(nd,parsed),{signal,onText:({text})=>onProgress&&onProgress(text.length)});
    plan = sanitizePlan(raw, nd);
    if(plan.questions.length<3) throw {code:'invalid_json'};
  }catch(e){
    if(e && e.code==='cancelled') throw e;
    note = aiFail(e);
    plan = sanitizePlan(fallbackPlan(nd,parsed), nd);
  }
  if(nd.source!=='voqiva_panel' && plan.methodology==='voice_interview') plan.methodology='whatsapp_voice';
  const segc = plan.criteria.find(c=>c.attribute==='segment'); if(segc && nd.source==='voqiva_panel') plan.incentive_inr = segmentRate(segc.value);
  const s = ins('Study',{workspace_id:ui.ws,created_by:ui.user,parent_study_id:nd.parent_study_id||null,cohort_import_id:nd.source==='cohort_import'?nd.cohort_import_id:null,
    audience_source:nd.source,objective:nd.objective,title:plan.title,domain:plan.domain||parsed.domain,methodology:plan.methodology,sample_size:plan.sample_size,incentive_inr:plan.incentive_inr,
    reward_type:plan.reward_type,language:plan.language,max_duration_min:plan.max_duration_min,launched_at:null,closed_at:null,synthesized_at:null,headline:null,summary:null,confidence_pct:null,share_token:null,
    created_at:iso(Date.now()),updated_at:iso(Date.now())});
  plan.criteria.forEach(c=>ins('AudienceCriterion',{study_id:s.id,attribute:c.attribute,operator:c.operator,value:{v:c.value,label:c.label},quota_pct:c.quota_pct||null}));
  plan.questions.forEach((q,i)=>ins('Question',Object.assign({study_id:s.id,position:i+1},q)));
  save();
  return {study:s, note};
}

// ---------- launch ----------
function launchStudy(s){
  const crits = critRows(s.id);
  const f = feasibility(s, crits);
  const cands = f.people.slice().sort(()=>Math.random()-.5);
  const already = new Set(sessionsOf(s.id).map(x=>x.person_id));
  let q=0;
  for(const p of cands){
    if(q>=s.sample_size) break;
    if(already.has(p.id)) continue;
    const fraud = s.audience_source==='voqiva_panel' && !p.upi_verified_at && !p.aadhaar_verified_at;
    ins('Session',{study_id:s.id,person_id:p.id,screen_result:fraud?'fraud':'qualified',started_at:null,ended_at:null,recording_url:null,sentiment:null,summary:null,payout_status:null,payout_ref:null});
    if(!fraud) q++;
  }
  upd('Study',s.id,{launched_at:iso(Date.now())});
  chargeLaunch(s);
  save();
  return q;
}

${JSON.stringify(batch)}

Reply with only a JSON array:
[{"session_id":"...","sentiment":"positive|neutral|negative","summary":"one sentence on where they stand","signals":[{"label":"...","polarity":"..."}],"answers":[{"position":1,"text":"...","value":null,"probe":null,"probe_answer":null}]}]`;

function applyAIInterview(s, qs, sess, r){
  let at = rows('TranscriptTurn',t=>t.session_id===sess.id).reduce((a,t)=>Math.max(a,t.start_ms+8000),2000);
  // drop a dangling moderator turn for the current question; we'll rewrite it
  const answered = new Set(rows('TranscriptTurn',t=>t.session_id===sess.id&&t.speaker==='participant').map(t=>t.question_id));
  delWhere('TranscriptTurn',t=>t.session_id===sess.id && t.speaker==='moderator' && !answered.has(t.question_id));
  (r.answers||[]).sort((a,b)=>a.position-b.position).forEach(a=>{
    const q = qs.find(x=>x.position===Number(a.position)); if(!q || answered.has(q.id) || !a.text) return;
    let v = a.value;
    if(q.input_type==='slider'){ v=Number(v); const c=q.config||{}; if(isNaN(v)) v=null; else v=Math.min(c.max??v,Math.max(c.min??v,v)); }
    if(q.input_type==='choice'){ const o=(q.config&&q.config.options)||[]; v=(Array.isArray(v)?v:[v]).filter(x=>o.includes(x)); if(!v.length) v=null; }
    at = writeTurns(sess, q, q.prompt, String(a.text), at, v);
    if(a.probe && a.probe_answer){
      ins('TranscriptTurn',{session_id:sess.id,question_id:q.id,speaker:'moderator',start_ms:at,text:String(a.probe)});
      const ps = at+3000+String(a.probe).length*60;
      ins('TranscriptTurn',{session_id:sess.id,question_id:q.id,speaker:'participant',start_ms:ps,text:String(a.probe_answer)});
      at = ps+12000+String(a.probe_answer).length*250;
    }
  });

}
async function runFieldwork(studyId){
  if(FIELD) return;
  const s = byId('Study',studyId); const qs = questionsOf(studyId);
  const todo = sessionsOf(studyId).filter(x=>x.screen_result==='qualified'&&!x.ended_at);
  if(!todo.length){ toast('All interviews are complete.'); return; }
  const scriptKey = DB._meta.scripts[studyId];
  FIELD = {studyId, ctl:new AbortController(), done:0, total:todo.length, msg:'Starting interviews…'};
  render();
  const B=5;
  try{
    for(let i=0;i<todo.length;i+=B){
      if(FIELD.ctl.signal.aborted) break;
      const batch = todo.slice(i,i+B);
      batch.forEach(x=>{ if(!x.started_at) x.started_at=iso(Date.now()); x.payout_status='pending'; });
      FIELD.msg = `Interviewing ${batch.map(x=>shortName(byId('Person',x.person_id).full_name)).join(', ')}`; render();
      let results = null;
      try{
        const payload = batch.map(x=>{ const p=byId('Person',x.person_id); const answered=new Set(rows('TranscriptTurn',t=>t.session_id===x.id&&t.speaker==='participant').map(t=>t.question_id));
          return {session_id:x.id,name:p.full_name,age:personAge(p),gender:p.gender,city:p.city,occupation:p.occupation,todo:qs.filter(q=>!answered.has(q.id)).map(q=>q.position)}; });
        const r = await aiJSON(fieldPrompt(s,qs,payload),{signal:FIELD.ctl.signal});
        if(Array.isArray(r)) results = r;
      }catch(e){ if(e&&e.code==='cancelled') break; FIELD.note = aiFail(e); }
      batch.forEach(x=>{
        const r = results && results.find(y=>y.session_id===x.id);
        if(r) applyAIInterview(s,qs,x,r);
        else { const g = genSessionFromPools(x,qs,scriptKey,{}); finishSession(x,s,T(x.started_at)+g.at+15000,g.score>0?'positive':g.score<0?'negative':'neutral',autoSummary(x)); }
        FIELD.done++;
      });
      save(); render();
    }
  } finally {
    const note = FIELD.note; FIELD=null; save(); render();
    toast(note ? 'Interviews done. '+note : 'Interviews done. Payouts released.');
  }
}

let SYNTH = null;
function synthPrompt(s, done){
  const qs = questionsOf(s.id);
  const transcripts = done.map(x=>{
    const p = byId('Person',x.person_id);
    return {session_id:x.id, who:`${p.gender||''}, ${personAge(p)||'?'}, ${p.city||''}, ${p.occupation||''}`,
      turns: rows('TranscriptTurn',t=>t.session_id===x.id&&t.speaker==='participant').sort((a,b)=>a.start_ms-b.start_ms).map(t=>({ms:t.start_ms,q:(qs.find(q=>q.id===t.question_id)||{}).position,text:t.text}))};
  });
  const stats = qs.filter(q=>q.input_type==='slider'||q.input_type==='choice').map(q=>{
    const vals = rows('Answer',a=>a.question_id===q.id).map(a=>a.value_json.value);
    if(q.input_type==='slider'){ const v=vals.map(Number).sort((a,b)=>a-b); return {question:q.prompt,n:v.length,min:v[0],median:v[Math.floor((v.length-1)/2)],max:v[v.length-1]}; }
    const c={}; vals.flat().forEach(o=>c[o]=(c[o]||0)+1); return {question:q.prompt,n:vals.length,counts:c};
  });
  return `You are Voqiva's synthesis analyst. Synthesise these ${done.length} customer interviews into evidence-backed insights for a founder.

OBJECTIVE: ${s.objective}
QUESTIONS: ${JSON.stringify(qs.map(q=>({position:q.position,prompt:q.prompt})))}
STRUCTURED ANSWER STATS: ${JSON.stringify(stats)}
TRANSCRIPTS (participant turns only; ms = timestamp):
${JSON.stringify(transcripts)}

RULES
- 3 to 6 themes. category is one of unmet_need | buying_driver | friction | preference.
- For each theme list supporting_session_ids: every session that clearly expresses the idea. Be strict: only include a session if a turn supports it.
- For each theme give 1-4 evidence items: {"session_id","ms","quote"} where quote is copied VERBATIM from that session's turn with that ms (you may shorten it with "…" but do not change words).
- "metric_label": 3-7 words describing what the supporting participants share, e.g. "Cite creasing on the commute".
- Do not invent numbers. Counts are computed from your supporting_session_ids.
- headline: one sentence, the single most decision-relevant finding. summary: 2 sentences.
- recommendations: 3-5 items. workstream product | pricing | gtm | research. Include at least one "research" follow-up whose body_md is a ready-to-run study objective. body_md uses "- **Bold lead:** detail" bullets for non-research items. impact and effort are high | medium | low. theme_index points into your themes array (or null). Optional "projected": [{"label","value":number,"unit":"pct|inr|multiplier","description"}] for forward-looking estimates; these are shown as hypotheses, so only include them when useful.

Reply with only this JSON:
{"headline":"...","summary":"...","themes":[{"category":"...","name":"2-3 words","headline":"...","body":"2 sentences","metric_label":"...","supporting_session_ids":["..."],"evidence":[{"session_id":"...","ms":0,"quote":"..."}]}],
 "recommendations":[{"workstream":"...","title":"...","body_md":"...","impact":"...","effort":"...","theme_index":0,"track":"...","owner_team":"...","projected":[]}]}`;
}
function norm(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9₹ ]/g,' ').replace(/\s+/g,' ').trim(); }
function ingestAISynthesis(s, r, done){
  const ids = new Set(done.map(x=>x.id));
  const themes = (Array.isArray(r.themes)?r.themes:[]).slice(0,6).map(t=>{
    const support = new Set((t.supporting_session_ids||[]).filter(id=>ids.has(id)));
    const evidence = [];
    (t.evidence||[]).forEach(e=>{
      if(!ids.has(e.session_id)) return;
      const turns = rows('TranscriptTurn',x=>x.session_id===e.session_id&&x.speaker==='participant');
      const q = norm(String(e.quote||'').replace(/…|\.\.\./g,' '));
      const words = q.split(' ').filter(w=>w.length>3).slice(0,6);
      // a quote only counts if it really appears in that participant's turns
      const turn = turns.find(x=>x.start_ms===Number(e.ms) && words.every(w=>norm(x.text).includes(w))) || turns.find(x=>words.length && words.every(w=>norm(x.text).includes(w)));
      if(turn){ support.add(e.session_id); if(!evidence.some(v=>v.turn.id===turn.id)) evidence.push({session_id:e.session_id,turn}); }
    });
    return {category:CAT_LABEL[t.category]?t.category:'preference',name:String(t.name||'Theme').slice(0,40),headline:String(t.headline||''),body:String(t.body||''),metric:String(t.metric_label||t.name||''),support,evidence};
  });
  const recs = (Array.isArray(r.recommendations)?r.recommendations:[]).slice(0,6).map(x=>({
    workstream:WS_LABEL[x.workstream]?x.workstream:'product',title:String(x.title||''),body_md:String(x.body_md||''),impact:['high','medium','low'].includes(x.impact)?x.impact:'medium',effort:['high','medium','low'].includes(x.effort)?x.effort:'medium',
    theme:Number.isInteger(x.theme_index)&&themes[x.theme_index]?x.theme_index:null,track:x.track||null,owner_team:x.owner_team||null,
    projected:(Array.isArray(x.projected)?x.projected:[]).filter(m=>m&&typeof m.value==='number'&&['pct','inr','multiplier'].includes(m.unit)).slice(0,2)}));
  const pricingRec = recs.find(x=>x.workstream==='pricing');
  const pq = questionsOf(s.id).find(q=>q.input_type==='slider'&&(q.config||{}).unit==='inr');
  if(pricingRec && pq){ const v=rows('Answer',a=>a.question_id===pq.id).map(a=>Number(a.value_json.value)).sort((a,b)=>a-b); if(v.length) pricingRec.willingnessAt = v[Math.floor((v.length-1)/2)]; }
  const sc = SCRIPTS[DB._meta.scripts[s.id]];
  writeSynthesis(s,{headline:String(r.headline||''),summary:String(r.summary||''),themes,recs,swatches:sc&&sc.swatches});
}
async function runSynthesis(studyId){
  if(SYNTH) return;
  const s = byId('Study',studyId);
  if(!s.closed_at && !isTriggerStudy(s)) closeAndRefund(s);
  const done = completedOf(studyId);
  SYNTH = {studyId, ctl:new AbortController(), chars:0};
  save(); render();
  let note = null;
  try{
    const r = await aiJSON(synthPrompt(s,done),{signal:SYNTH.ctl.signal,onText:({text})=>{ if(SYNTH){ SYNTH.chars=text.length; const el=document.getElementById('synth-progress'); if(el) el.textContent='Writing synthesis… '+Math.round(text.length/40)+' lines'; } }});

}

function srcOption(k,title,desc,badge,extra=''){

const RULE_ATTRS = [['gender','Gender','eq','male / female'],['age','Age range','between','e.g. 22-30'],['city','City','eq','e.g. Hyderabad'],['industry','Industry','in','e.g. Tech, FinTech'],['d2c_fashion_orders_60d','D2C fashion orders (60 days) at least','gte','e.g. 2'],['quick_commerce_orders_30d','Quick-commerce orders (30 days) at least','gte','e.g. 4'],['skincare_buyer','Skincare buyer','eq','true'],['upi_verified','UPI verified','eq','true'],['custom','Custom screener rule','eq','e.g. Owns a two-wheeler']];
function ruleForm(scope){
  if(ui.addRule!==scope) return `<button class="chip plain" style="align-self:flex-start" data-act="rule-open" data-scope="${scope}">${ic('plus').replace('<svg','<svg style="width:14px"')} Add filter rule</button>`;
  return `<form class="well row" data-submit="rule-add" data-scope="${scope}" style="align-items:flex-end">
    <div style="flex:1;min-width:180px"><label class="lbl" for="rule-attr">Rule</label><select class="field" id="rule-attr">${RULE_ATTRS.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</select></div>
    <div style="flex:1;min-width:160px"><label class="lbl" for="rule-val">Value</label><input class="field" id="rule-val" placeholder="e.g. 22-30 or Hyderabad" required></div>
    <button class="btn primary" type="submit">Add</button><button class="btn" type="button" data-act="rule-cancel">Cancel</button></form>`;
}
function parseRule(attr, raw){
  const r = RULE_ATTRS.find(x=>x[0]===attr); raw=String(raw).trim(); if(!raw) return null;
  let value = raw, label = r[1]+': '+raw;
  if(attr==='age'){ const m=raw.match(/(\d+)\D+(\d+)/); if(!m) return null; value=[+m[1],+m[2]]; label='Ages '+m[1]+'–'+m[2]; }
  if(attr==='gender'){ value = /^f|wom/i.test(raw)?'female':'male'; label = value==='female'?'Women':'Men'; }
  if(attr==='city'){ value = CITY_ALIASES[raw.toLowerCase()]||raw; label=value; }
  if(attr==='industry'){ value = raw.split(',').map(x=>x.trim()).filter(Boolean); label='Industry: '+value.join(', '); }
  if(r[2]==='gte'){ value = +raw||1; label = r[1].replace(' at least','')+' ≥ '+value; }
  if(['skincare_buyer','upi_verified'].includes(attr)){ value = true; label = r[1]; }
  if(attr==='custom') return {attribute:'screener_note',operator:'eq',value:raw,label:raw};
  return {attribute:attr,operator:r[2],value,label};
}

function vLive(s){
  const st = studyStatus(s);
  if(st==='draft') return `<div class="empty">Not launched yet. <a href="#plan-${s.id}">Review plan</a></div>`;
  const all = sessionsOf(s.id); const q = all.filter(x=>x.screen_result==='qualified');
  const fraud = all.filter(x=>x.screen_result==='fraud').length;
  const done = q.filter(x=>x.ended_at), live = q.filter(x=>x.started_at&&!x.ended_at), queued = q.filter(x=>!x.started_at);
  const people = q.map(x=>byId('Person',x.person_id));
  const aad = people.filter(p=>p.aadhaar_verified_at).length, li = people.filter(p=>p.linkedin_verified_at).length;
  const avg = done.length? done.reduce((a,x)=>a+(T(x.ended_at)-T(x.started_at)),0)/done.length : 0;
  const reserve = -rows('WalletTransaction',t=>t.study_id===s.id&&t.kind==='incentive_reserve').reduce((a,t)=>a+t.amount_inr,0);
  const paid = q.filter(x=>x.payout_status==='paid').length, failed = q.filter(x=>x.payout_status==='failed').length;
  const running = FIELD && FIELD.studyId===s.id, synth = SYNTH && SYNTH.studyId===s.id;
  const sorted = [...live, ...done.sort((a,b)=>T(b.ended_at)-T(a.ended_at)), ...queued];
  if(!ui.sel[s.id] || !sorted.some(x=>x.id===ui.sel[s.id])) ui.sel[s.id] = (done[0]||live[0]||{}).id;
  const shown = ui.showAll? sorted : sorted.slice(0,6);
  return `
  <div class="crumbs"><a href="#studies">Studies</a><span>/</span><b>${esc(s.title)}</b></div>
  ${studyStepper(s,'live')}
  <section class="row between" style="align-items:flex-start">
    <div class="stack" style="gap:8px"><div class="row"><h1>${esc(s.title)}</h1>${statusPill(s)}</div>
      <div class="row small muted" style="gap:14px"><span class="pill">${audienceLine(s)}</span><span>Started ${ago(s.launched_at)}</span><span>${esc(METHOD_LABEL[s.methodology])} · ${esc(LANG_LABEL[s.language])}</span><span style="color:var(--ok)">Incentive escrow: ${inr(reserve)}</span></div></div>
    <div class="row">
      ${st==='live'? (running? `<button class="btn" data-act="field-stop">${ic('stop')}Pause interviews</button>` : (live.length+queued.length? `<button class="btn" data-act="field-run" data-id="${s.id}">${ic('play')}Run remaining ${live.length+queued.length} interviews</button>`:''))
        +`<button class="btn primary" data-act="synth" data-id="${s.id}" ${!done.length||running?'disabled':''}>${ic('spark')}${isTriggerStudy(s)?'Synthesise so far':'Close &amp; synthesise'} (${done.length} ready)</button>` + (s.synthesized_at?`<a class="btn" href="#report-${s.id}">Latest insights</a>`:'') : ''}
      ${st==='synthesizing' && !synth ? `<button class="btn primary" data-act="synth" data-id="${s.id}">${ic('spark')}Run synthesis</button>`:''}
      ${st==='ready'? `<a class="btn primary" href="#report-${s.id}">View synthesised insights ${ic('right')}</a>`:''}
    </div>
  </section>
  ${running? `<section class="card tint row between"><div class="row"><div class="wave">${[14,22,10,26,16,20,12].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div><b>${esc(FIELD.msg)}</b><div class="small muted">${FIELD.done} of ${FIELD.total} done · responses are AI-simulated in this prototype</div></div></div><div class="bar" style="width:200px"><i style="width:${FIELD.done/FIELD.total*100}%"></i></div></section>`:''}
  ${synth? `<section class="card tint row"><span class="dot pulse" style="color:var(--accent)"></span><b id="synth-progress">Reading ${done.length} transcripts…</b><span style="flex:1"></span><button class="btn sm" data-act="synth-stop">${ic('stop')}Stop</button></section>`+skeletonThemes():''}
  <section class="grid g3">
    <div class="card kpi stack"><div class="row between"><span class="eyebrow">Recruitment &amp; screening</span>${ic('shield').replace('<svg','<svg style="width:20px;color:var(--accent)"')}</div>
      <div class="big num">${q.length}<small>/ ${s.sample_size} qualified</small></div>
      <div class="row small" style="gap:12px"><span style="color:var(--ok)">${pct(q.length/Math.max(1,s.sample_size)*100)} of target</span><span>${fraud} blocked at verification</span></div>
      ${s.audience_source==='voqiva_panel'?`<div class="row between small muted"><span>Aadhaar KYC: ${q.length?pct(aad/q.length*100):'—'}</span><span>LinkedIn linked: ${li}/${q.length}</span></div>`:`<div class="row between small muted"><span>Purchase-verified: ${people.filter(p=>buyerStats(p.id)).length}/${q.length}</span><span>Consent on record: ${people.filter(p=>consentOf(p.id)).length}/${q.length}</span></div>`}</div>
    <div class="card kpi stack"><div class="row between"><span class="eyebrow">Interview completion</span></div>
      <div class="big num">${done.length}<small>completed · <span style="color:var(--accent)">${live.length} live</span> · ${queued.length} queued</small></div>
      <div class="bar ok"><i style="width:${done.length/Math.max(1,s.sample_size)*100}%"></i></div>
      <div class="row between small muted"><span style="color:var(--ok);font-weight:600">${pct(done.length/Math.max(1,s.sample_size)*100)} of goal</span><span>Avg. duration ${avg?mmss(avg):'—'}</span></div></div>
    <div class="card kpi stack"><div class="row between"><span class="eyebrow">Incentives disbursed</span></div>

  <div class="row between"><div class="tabs">${[['feed',`Respondents (${q.length})`],['sentiment','Sentiment & signals']].map(([k,l])=>`<button class="${ui.liveTab===k?'on':''}" data-act="live-tab" data-k="${k}">${l}</button>`).join('')}</div>
    ${live.length?`<span class="pill acc"><span class="dot pulse"></span>${live.length} AI voice calls in session</span>`:''}</div>
  ${ui.liveTab==='feed'? `
  <div class="grid split" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start">
    <div class="stack">${shown.map(x=>sessCard(s,x,questionsOf(s.id))).join('')}
      ${sorted.length>6?`<button class="btn" data-act="show-all">${ui.showAll?'Show fewer':'Show all '+sorted.length+' respondents'}</button>`:''}</div>
    <aside class="side-sticky">${transcriptPanel(s, byId('Session',ui.sel[s.id]))}</aside>
  </div>` : sentimentPanel(s, done)}
  ${st==='live' && done.length? `<section class="card banner"><div class="avatar" style="width:48px;height:48px">${ic('spark')}</div>
    <div><h3>${done.length} interview transcripts ready for synthesis</h3><p class="small muted">${isTriggerStudy(s)?'This always-on study keeps listening. Synthesising groups everything heard so far into themes, each backed by quotes and order data.':'Closing the study stops new interviews and refunds unused incentive. Then the AI groups what people said into themes, each backed by quotes.'}</p></div>
    <button class="btn" data-act="synth" data-id="${s.id}" ${running?'disabled':''}>${isTriggerStudy(s)?'Synthesise so far':'Close &amp; synthesise'} ${ic('right')}</button></section>`:''}`;
}
function sessCard(s, x, qs){
  const p = byId('Person',x.person_id); const sel = ui.sel[s.id]===x.id;
  const sig = rows('Signal',g=>g.session_id===x.id);
  const isLive = x.started_at && !x.ended_at;
  const badges = [p.aadhaar_verified_at&&'Aadhaar',p.linkedin_verified_at&&'LinkedIn',p.upi_verified_at&&'UPI'].filter(Boolean);
  let right;
  if(x.ended_at) right = `<span class="pill ok">Completed (${mmss(T(x.ended_at)-T(x.started_at))})</span><div class="small muted num">${x.payout_status==='paid'?inr(s.incentive_inr)+' sent · '+esc(String(x.payout_ref).slice(-8)):'Payout pending'}</div>`;
  else if(isLive) right = `<span class="pill acc"><span class="dot pulse"></span>In live AI call</span><div class="small muted">Payout held in escrow</div>`;
  else right = `<span class="pill">Queued</span><div class="small muted">Qualified, call not started</div>`;
  const lastMod = isLive && rows('TranscriptTurn',t=>t.session_id===x.id&&t.speaker==='moderator').sort((a,b)=>b.start_ms-a.start_ms)[0];
  const topic = lastMod && (qs.find(q=>q.id===lastMod.question_id)||{}).section;
  return `<article class="sess ${sel?'sel':''} ${isLive?'live':''}" data-act="sel-sess" data-sid="${s.id}" data-id="${x.id}" tabindex="0">
    <div class="row between" style="align-items:flex-start"><div class="row" style="flex-wrap:nowrap;min-width:0"><div class="avatar">${initials(p.full_name)}</div>
      <div style="min-width:0"><div class="row" style="gap:8px"><b style="font-family:var(--display);font-size:17px">${esc(shortName(p.full_name))}, ${personAge(p)||''}</b>${badges.length?`<span class="pill ok" style="font-size:11px">${ic('check').replace('<svg','<svg style="width:12px"')}${badges.join(' & ')}</span>`:''}${p.cohort_import_id?'<span class="pill" style="font-size:11px">Your customer</span>':''}</div>
      <div class="small muted">${esc(p.city||'')} · ${esc(p.occupation||'')}</div></div></div>
      <div style="text-align:right">${right}</div></div>
    ${x.summary?`<div class="well small"><b>Sentiment: ${esc(x.sentiment||'')}</b> · ${esc(x.summary)}</div>`:''}
    ${topic?`<div class="well small row between"><span>Current topic: ${esc(topic)}</span><span style="color:var(--accent);font-weight:600">Listening in…</span></div>`:''}
    ${sig.length?`<div class="row" style="gap:6px">${sig.map(g=>`<span class="pill ${g.polarity==='positive'?'ok':g.polarity==='critical'?'bad':g.polarity==='negative'?'warn':''}" style="font-size:11.5px">${esc(g.label)}</span>`).join('')}</div>`:''}
  </article>`;
}
function transcriptPanel(s, x){
  if(!x) return `<div class="card empty">No interviews have started yet. Run the interviews to see transcripts here.</div>`;
  const p = byId('Person',x.person_id); const qs = questionsOf(s.id);
  const turns = rows('TranscriptTurn',t=>t.session_id===x.id).sort((a,b)=>a.start_ms-b.start_ms);
  const ans = rows('Answer',a=>a.session_id===x.id);
  const sig = rows('Signal',g=>g.session_id===x.id);
  const total = x.ended_at? T(x.ended_at)-T(x.started_at) : (turns.length? turns[turns.length-1].start_ms+5000:0);
  return `<section class="card stack" style="gap:14px">
    <div class="row between"><b style="font-family:var(--display);font-size:18px"><span class="dot" style="color:${x.ended_at?'var(--ok)':'var(--accent)'}"></span> ${esc(shortName(p.full_name))} · Transcript</b><span class="small muted num">${mmss(total)}</span></div>
    <div class="well small muted">Audio recordings are not stored in this prototype. The transcript below is the record.</div>
    <div class="transcript">${turns.map(t=>{ const q=qs.find(z=>z.id===t.question_id);
      return t.speaker==='moderator'
        ? `<div class="stack" style="gap:4px"><span class="small" style="color:var(--accent);font-weight:600">Voqiva AI moderator · ${mmss(t.start_ms)}${q?' · Q'+q.position:''}</span><div class="bubble mod">${esc(t.text)}</div></div>`
        : `<div class="stack" style="gap:4px;align-items:flex-end"><span class="small muted">${mmss(t.start_ms)} · ${esc(shortName(p.full_name))}</span><div class="bubble par">${esc(t.text)}</div></div>`; }).join('') || '<span class="muted small">Waiting for the call to start…</span>'}
      ${x.started_at&&!x.ended_at?'<div class="row small muted"><div class="wave" style="height:18px">'+[8,14,6,16,10].map(h=>`<i style="height:${h}px"></i>`).join('')+'</div>Participant is answering…</div>':''}</div>
    ${ans.length?`<div class="stack" style="gap:6px"><span class="eyebrow">Structured answers</span>${ans.map(a=>{ const q=qs.find(z=>z.id===a.question_id); const v=a.value_json.value; return `<div class="row between small"><span class="muted">Q${q?q.position:''} ${esc(q?q.section:'')}</span><b class="num">${Array.isArray(v)?esc(v.join(', ')):(q&&q.config&&q.config.unit==='inr'?inr(v):esc(v))}</b></div>`; }).join('')}</div>`:''}
    ${sig.length?`<div class="stack" style="gap:6px"><span class="eyebrow">Signals extracted in real time</span><div class="row" style="gap:6px">${sig.map(g=>`<span class="pill ${g.polarity==='positive'?'ok':g.polarity==='critical'?'bad':g.polarity==='negative'?'warn':''}">${esc(g.label)}</span>`).join('')}</div></div>`:''}
  </section>`;
}
function sentimentPanel(s, done){
  const c = {positive:0,neutral:0,negative:0}; done.forEach(x=>c[x.sentiment]=(c[x.sentiment]||0)+1);
  const n = done.length||1;
  const g = {}; done.forEach(x=>rows('Signal',z=>z.session_id===x.id).forEach(z=>{ (g[z.label]=g[z.label]||{p:z.polarity,n:0}).n++; }));
  const top = Object.entries(g).sort((a,b)=>b[1].n-a[1].n).slice(0,12);
  return `<div class="grid g2" style="align-items:start">
    <section class="card stack"><h3>Overall sentiment</h3><p class="small muted">${done.length} completed interviews</p>
      ${[['positive','Positive','ok'],['neutral','Neutral',''],['negative','Negative','warn']].map(([k,l,cl])=>`<div class="stack" style="gap:4px"><div class="row between small"><b>${l}</b><span class="num">${c[k]} · ${pct(c[k]/n*100)}</span></div><div class="bar ${cl==='ok'?'ok':''}"><i style="width:${c[k]/n*100}%;${cl==='warn'?'background:var(--warn)':cl===''?'background:var(--faint)':''}"></i></div></div>`).join('')}</section>
    <section class="card stack"><h3>Most frequent signals</h3>
      <div class="table-wrap"><table><thead><tr><th>Signal</th><th>Tone</th><th style="text-align:right">Interviews</th></tr></thead><tbody>
      ${top.map(([l,v])=>`<tr><td>${esc(l)}</td><td><span class="pill ${v.p==='positive'?'ok':v.p==='critical'?'bad':v.p==='negative'?'warn':''}">${v.p}</span></td><td class="num" style="text-align:right">${v.n}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No signals yet</td></tr>'}</tbody></table></div></section></div>`;
}

function themeStats(t){ return one('Metric',m=>m.theme_id===t.id&&m.position===1)||{participant_count:0,value:0}; }

  if(!s.synthesized_at) return `<div class="empty">Insights aren't ready yet. <a href="#live-${s.id}">Open live monitor</a> to close the study and run synthesis.</div>`;

  const done = completedOf(s.id); const N = done.length;
  const cats = ['unmet_need','buying_driver','friction','preference'];
  const shown = themes.filter(t=>ui.themeFilter==='all'||t.category===ui.themeFilter);
  const cities = [...new Set(done.map(x=>byId('Person',x.person_id).city))];
  return `
  ${ui.reveal===s.id?revealBlock(s):''}
  <div class="crumbs"><a href="#studies">Studies</a><span>/</span><a href="#live-${s.id}">${esc(s.title)}</a><span>/</span><b>Insights report</b></div>
  ${studyStepper(s,'insights')}
  <section class="row between" style="align-items:flex-end">

function themeCard(s,t,N){

function wtpChart(s){
  const q = questionsOf(s.id).find(x=>x.input_type==='slider'&&(x.config||{}).unit==='inr'); if(!q) return '';
  const vals = rows('Answer',a=>a.question_id===q.id).map(a=>Number(a.value_json.value)).filter(v=>!isNaN(v)); if(vals.length<3) return '';
  const c = q.config, lo=c.min, hi=c.max, step=c.step||Math.round((hi-lo)/14);
  const pts=[]; for(let p=lo;p<=hi;p+=step) pts.push([p, vals.filter(v=>v>=p).length/vals.length*100]);
  const W=640,H=220,L=44,R=16,Tp=14,B=34; const x=p=>L+(p-lo)/(hi-lo)*(W-L-R), y=v=>Tp+(100-v)/100*(H-Tp-B);
  const line = pts.map(([p,v],i)=>(i?'L':'M')+x(p).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const med = [...vals].sort((a,b)=>a-b)[Math.floor((vals.length-1)/2)];
  const ticks = [lo, lo+Math.round((hi-lo)/2/step)*step, hi];
  return `<section class="card stack"><div class="row between"><div><h3>Willingness to pay</h3><p class="small muted">Share of ${vals.length} participants who would pay at least each price (Q${q.position} slider answers)</p></div><span class="pill ok num">Median ${inr(med)}</span></div>
    <div class="table-wrap"><svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Willingness to pay curve" style="min-width:420px">
      ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`).join('')}
      <path d="${line} L ${x(hi)} ${y(0)} L ${x(lo)} ${y(0)} Z" fill="var(--accent-soft)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      <line x1="${x(med)}" x2="${x(med)}" y1="${Tp}" y2="${H-B}" stroke="var(--ok)" stroke-dasharray="4 4"/>
      ${ticks.map(p=>`<text x="${x(p)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${inr(p)}</text>`).join('')}
    </svg></div></section>`;
}

function mdLite(md){
  const lines = String(md||'').split('\n').filter(l=>l.trim());

  return `<p>${inl(md)}</p>`;
}

const daysSince = ts => (Date.now()-T(ts))/86400000;
function ordersOf(pid){ return rows('Order',o=>o.person_id===pid).sort((a,b)=>T(a.placed_at)-T(b.placed_at)); }
function buyerStats(pid){
  const os = ordersOf(pid); if(!os.length) return null;
  const total = os.reduce((a,o)=>a+o.value_inr,0);
  return {n:os.length,last:os[os.length-1],first:os[0],aov:Math.round(total/os.length),
    ltv:os.filter(o=>o.status==='delivered').reduce((a,o)=>a+o.value_inr,0),returns:os.filter(o=>o.status!=='delivered').length};
}
const ordinal = n => n+(n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');
function purchaseBadge(pid){
  const b = buyerStats(pid);
  if(!b){ const p=byId('Person',pid); return p&&p.cohort_import_id? `<span class="pill">Your customer</span>` : `<span class="pill" title="Voqiva panelist, not a buyer">Panelist</span>`; }
  const d = new Date(b.last.placed_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  const st = b.last.status==='delivered' ? '' : b.last.status==='returned' ? ' · returned' : ' · RTO';
  return `<span class="pill buy" title="Matched to a real order">${ic('check')}Bought ${d} · ${inr(b.last.value_inr)} · ${ordinal(b.n)} order${st}</span>`;
}
function circle(wsId){ return rows('Consent',c=>c.workspace_id===wsId&&!c.withdrawn_at); }
function consentOf(pid){ return rows('Consent',c=>c.person_id===pid).sort((a,b)=>T(b.granted_at)-T(a.granted_at))[0]; }

// audience: own customers count only if they opted in (DPDP consent on record)
function audienceBase(src){
  if(src.audience_source==='cohort_import'){
    const ids = new Set(circle(src.workspace_id||ui.ws).map(c=>c.person_id));
    return rows('Person',p=>(src.cohort_import_id? p.cohort_import_id===src.cohort_import_id : !!p.cohort_import_id) && ids.has(p.id));

}

function monthStart(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); }
function freeUsed(wsId){
  return rows('Study',s=>s.workspace_id===wsId && s.launched_at && T(s.launched_at)>=monthStart() && s.audience_source!=='voqiva_panel' && !isTriggerStudy(s)
    && !rows('WalletTransaction',t=>t.study_id===s.id&&t.kind==='synthesis_fee').length).reduce((a,s)=>a+(s.sample_size||0),0);

function freeLeft(wsId){ return Math.max(0,FREE_QUOTA-freeUsed(wsId)); }
function studyBudget(s){
  const n=s.sample_size||0, inc=s.incentive_inr||0, incent=n*inc;
  const free = !s.launched_at && s.audience_source!=='voqiva_panel' && n<=freeLeft(s.workspace_id);
  const syn = free?0:feeOf('synthesis_fee'), dis = free?0:feeOf('disbursement_fee');
  return {n,inc,incent,syn,dis,total:incent+syn+dis,free};
}
function feeCell(v, kind, free){ return free? `<span class="num"><s class="faint">${inr(feeOf(kind))}</s> <b style="color:var(--ok)">Free</b></span>` : `<b class="num">${inr(v)}</b>`; }
function launchStudyCore(s){
  const b = studyBudget(s);
  const f = feasibility(s, critRows(s.id));
  const cands = f.people.slice().sort(()=>Math.random()-.5);
  const already = new Set(sessionsOf(s.id).map(x=>x.person_id));
  let q=0;
  for(const p of cands){
    if(q>=s.sample_size) break;
    if(already.has(p.id)) continue;
    const fraud = s.audience_source==='voqiva_panel' && !p.upi_verified_at && !p.aadhaar_verified_at;
    ins('Session',{study_id:s.id,person_id:p.id,screen_result:fraud?'fraud':'qualified',started_at:null,ended_at:null,recording_url:null,sentiment:null,summary:null,payout_status:null,payout_ref:null});
    if(!fraud) q++;
  }
  upd('Study',s.id,{launched_at:iso(Date.now())});
  const t = s.launched_at;
  ins('WalletTransaction',{workspace_id:s.workspace_id,study_id:s.id,kind:'incentive_reserve',amount_inr:-b.incent,created_at:t});
  if(b.syn) ins('WalletTransaction',{workspace_id:s.workspace_id,study_id:s.id,kind:'synthesis_fee',amount_inr:-b.syn,created_at:t});
  if(b.dis) ins('WalletTransaction',{workspace_id:s.workspace_id,study_id:s.id,kind:'disbursement_fee',amount_inr:-b.dis,created_at:t});
  save();
  return q;
}
